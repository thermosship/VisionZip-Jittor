[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionzip-jittor"
version = "0.1.0"
description = "Native Jittor reproduction and PyTorch alignment tools for VisionZip"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "thermosship"}]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
reference = ["torch==2.1.2"]
jittor = ["jittor==1.3.11.0"]
real-clip = ["transformers==4.31.0", "Pillow>=9.5,<12"]
phase3b-reference = ["torch==2.1.2", "transformers==4.31.0", "numpy>=1.23,<2.0"]
phase3b-jittor = ["jittor==1.3.11.0", "transformers==4.31.0", "tokenizers>=0.13.3,<0.14", "numpy>=1.23,<2.0"]
phase4b-prepare = ["huggingface_hub>=0.23,<1.0", "pyarrow>=14,<20", "Pillow>=9.5,<12", "numpy>=1.23,<2.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["visionzip_jittor*", "reference*"]
